name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: homecraftguild-${{ github.ref }}
  cancel-in-progress: false

env:
  MOD_ID: homecraftguild
  MOD_NAME: Home Craft Guilds
  AUTHOR: Lihvo_Druida
  TARGET_MINECRAFT_VERSION: '1.21.11'
  TARGET_LOADER: neoforge
  TARGET_JAVA: '21'
  CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

jobs:
  validate:
    name: Validate 1.21.11 release lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle launcher executable bit
        shell: bash
        run: chmod +x ./gradlew

      - name: Resolve release version from tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only supports v* tag builds. Current ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
            exit 1
          fi

          MOD_VERSION="${TAG#v}"
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "Could not resolve mod version. Expected tag format like v1.0 or v0.1.163" >&2
            exit 1
          fi

          sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties
          echo "Resolved Home Craft Guilds version from tag: ${MOD_VERSION}"
          grep '^mod_version=' gradle.properties

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate project is locked to NeoForge 1.21.11
        shell: bash
        run: python3 scripts/validate-release-1.21.11.py

      - name: Validate git-cliff config
        shell: bash
        run: python3 scripts/validate-cliff-config.py

      - name: Validate localization files
        shell: bash
        run: python3 scripts/validate-i18n.py

  build-neoforge-1-21-11:
    name: Build NeoForge for Minecraft 1.21.11
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      jar_name: ${{ steps.stage.outputs.jar_name }}
      mod_version: ${{ steps.release_version.outputs.mod_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle launcher executable bit
        shell: bash
        run: chmod +x ./gradlew

      - name: Resolve release version from tag
        id: release_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only supports v* tag builds. Current ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
            exit 1
          fi

          MOD_VERSION="${TAG#v}"
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "Could not resolve mod version. Expected tag format like v1.0 or v0.1.163" >&2
            exit 1
          fi

          sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Home Craft Guilds version: ${MOD_VERSION}"
          grep '^mod_version=' gradle.properties

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate 1.21.11 release lock after tag version injection
        shell: bash
        run: python3 scripts/validate-release-1.21.11.py

      - name: Build NeoForge jar
        shell: bash
        run: bash ./gradlew clean buildNeoForge --no-daemon --stacktrace

      - name: Stage release artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'homecraftguild-neoforge-1.21.11-*.jar' ! -name '*sources*.jar' | sort | head -n 1)"
          if [[ -z "${JAR_PATH}" || ! -f "${JAR_PATH}" ]]; then
            echo "Could not find runtime jar for Home Craft Guilds NeoForge 1.21.11 in build/libs" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi

          JAR_NAME="$(basename "${JAR_PATH}")"
          cp "${JAR_PATH}" "${OUT}/${JAR_NAME}"
          (
            cd "${OUT}"
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
          )

          cat > "${OUT}/${JAR_NAME}.metadata.json" <<JSON
          {
            "mod": "Home Craft Guilds",
            "modId": "homecraftguild",
            "author": "Lihvo_Druida",
            "modVersion": "${{ steps.release_version.outputs.mod_version }}",
            "minecraftVersion": "1.21.11",
            "loader": "neoforge",
            "loaderName": "NeoForge",
            "java": "21",
            "jar": "${JAR_NAME}"
          }
          JSON

          ARTIFACT_NAME="homecraftguild-${{ steps.release_version.outputs.mod_version }}-mc1.21.11-neoforge-jar"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          find "${OUT}" -maxdepth 1 -type f -print -exec ls -lah {} \;

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/*

  github-release:
    name: Publish GitHub release artifacts
    runs-on: ubuntu-latest
    needs: build-neoforge-1-21-11
    if: ${{ always() && github.ref_type == 'tag' && needs.build-neoforge-1-21-11.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_CHANGELOG.md

      - name: Verify generated release changelog
        shell: bash
        run: |
          test -s RELEASE_CHANGELOG.md
          cat RELEASE_CHANGELOG.md

      - name: Download NeoForge artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-neoforge-1-21-11.outputs.artifact_name }}
          path: release-jars

      - name: List release files
        shell: bash
        run: |
          test -n "$(find release-jars -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find release-jars -maxdepth 1 -type f -print | sort

      - name: Publish GitHub Release files
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: release-jars/*
          body_path: RELEASE_CHANGELOG.md

  curseforge-publish:
    name: Publish NeoForge 1.21.11 to CurseForge
    runs-on: ubuntu-latest
    needs: build-neoforge-1-21-11
    if: ${{ always() && github.ref_type == 'tag' && needs.build-neoforge-1-21-11.result == 'success' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CurseForge changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_CHANGELOG.md

      - name: Verify generated CurseForge changelog
        shell: bash
        run: test -s RELEASE_CHANGELOG.md

      - name: Download NeoForge artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-neoforge-1-21-11.outputs.artifact_name }}
          path: publish-artifact

      - name: Publish NeoForge 1.21.11 file to CurseForge
        if: env.CURSEFORGE_PROJECT_ID != '' && env.CURSEFORGE_TOKEN != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: publish-artifact/${{ needs.build-neoforge-1-21-11.outputs.jar_name }}
          name: Home Craft Guilds ${{ needs.build-neoforge-1-21-11.outputs.mod_version }} [Minecraft 1.21.11] NeoForge
          version: neoforge-${{ needs.build-neoforge-1-21-11.outputs.mod_version }}+mc1.21.11
          version-type: release
          changelog-file: RELEASE_CHANGELOG.md
          loaders: |
            neoforge
          game-versions: |
            1.21.11
          game-version-filter: none
          java: |
            Java 21
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge credentials not configured
        if: env.CURSEFORGE_PROJECT_ID == '' || env.CURSEFORGE_TOKEN == ''
        shell: bash
        run: |
          echo "Skipping CurseForge publish because CURSEFORGE_PROJECT_ID or CURSEFORGE_TOKEN is not configured."
